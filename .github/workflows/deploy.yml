name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel one that is in progress
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build runs on every push and pull request so broken builds are caught before merge.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build with Vite
        run: npm run build

      - name: Smoke-test the build output
        run: npm run test:build

      - name: Check generated docs are current
        run: npm run docs:check

      # The built game in headless Chromium: a new game, Chapter I on AUTO to the end, the Team
      # screen, the world map and a side battle, Chapter V, save and load, and a phone layout.
      # Any page error fails the build (scripts/playtest.mjs).
      - name: Install Chromium for the play-tests
        run: npx playwright install --with-deps chromium

      - name: Browser play-tests
        run: npm run playtest

      - name: Upload play-test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-failures
          path: playtest-*.png
          retention-days: 14

      # The same build, zipped for itch.io (relative paths, no remote fonts or scripts)
      - name: Package the itch.io HTML5 zip
        run: node scripts/package-itch.mjs

      - name: Upload the itch.io zip
        uses: actions/upload-artifact@v4
        with:
          name: itch-html5
          path: release/*.zip
          retention-days: 30

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  # Publishes main to itch.io with butler, itch's upload tool, once an API key is stored as the
  # repository secret BUTLER_API_KEY (itch.io → Settings → API keys). Without it this job skips.
  itch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: cptnope/chess-rpg-tactics:html5
    steps:
      - name: Skip (no BUTLER_API_KEY secret yet)
        if: env.BUTLER_API_KEY == ''
        run: echo "Add the BUTLER_API_KEY repository secret to publish to itch.io automatically."

      - name: Download the itch.io zip
        if: env.BUTLER_API_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: itch-html5
          path: release

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ZIP=$(ls release/*.zip)
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || basename "$ZIP" | sed -E 's/.*-([0-9.]+)-html5.zip/\1/')
          ./butler/butler push "$ZIP" "$ITCH_TARGET" --userversion "$VERSION"

  # Deploy is a separate job (GitHub's recommended layout). Splitting it out gives the
  # uploaded artifact time to register; deploying in the same job as the upload can fail
  # with "No artifacts named github-pages were found" (the 2026-11-18 failure).
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
